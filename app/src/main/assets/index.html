<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0d0d12" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>DictaTask — Voice to action</title>
    <script>
      (() => {
        let activeRecognition = null;

        class AndroidSpeechRecognition {
          constructor() {
            this.continuous = false;
            this.interimResults = false;
            this.lang = "en-US";
            this.onresult = null;
            this.onend = null;
            this.onerror = null;
          }

          start() {
            activeRecognition = this;
            if (window.DictaTaskAndroid && typeof window.DictaTaskAndroid.startRecognition === "function") {
              window.DictaTaskAndroid.startRecognition();
              return;
            }
            this._emitError("audio-capture");
            this._emitEnd();
          }

          stop() {
            if (window.DictaTaskAndroid && typeof window.DictaTaskAndroid.stopRecognition === "function") {
              window.DictaTaskAndroid.stopRecognition();
            }
          }

          abort() {
            if (window.DictaTaskAndroid && typeof window.DictaTaskAndroid.abortRecognition === "function") {
              window.DictaTaskAndroid.abortRecognition();
            }
            this._emitEnd();
          }

          _emitResult(transcript, isFinal) {
            if (typeof this.onresult === "function") {
              this.onresult({
                resultIndex: 0,
                results: [{ isFinal: Boolean(isFinal), 0: { transcript } }],
              });
            }
          }

          _emitError(error) {
            if (typeof this.onerror === "function") {
              this.onerror({ error });
            }
          }

          _emitEnd() {
            if (activeRecognition === this) {
              activeRecognition = null;
            }
            if (typeof this.onend === "function") {
              this.onend();
            }
          }
        }

        window.SpeechRecognition = AndroidSpeechRecognition;
        window.webkitSpeechRecognition = AndroidSpeechRecognition;
        window.__dictaSpeechResult = (transcript, isFinal) => {
          activeRecognition?._emitResult(String(transcript || ""), Boolean(isFinal));
        };
        window.__dictaSpeechError = (error) => {
          activeRecognition?._emitError(String(error || "audio-capture"));
        };
        window.__dictaSpeechEnd = () => {
          activeRecognition?._emitEnd();
        };
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-Co9mDPod.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-6dkJ7XyW.css">

    <div id="root"></div>
  </body>
</html>
